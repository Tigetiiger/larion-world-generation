plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
}

base { archivesName = "larion-rim-fabric-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

loom {
    accessWidenerPath = file('src/main/resources/larion_rim.accesswidener')
}

repositories {
    maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    // Optional: only used for the client config screen.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    // Optional: Distant Horizons SeedGen compat (mixins only apply when it is installed).
    // Not redistributable, so copy the jars into libs/ yourself: seedgen.jar and distanthorizons.jar.
    compileOnly files('libs/seedgen.jar', 'libs/distanthorizons.jar')
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
